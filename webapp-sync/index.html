<!DOCTYPE html>
<html lang="en" webapp="true">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark">
    <link rel="manifest" href="/site.webmanifest">
    <title>Heynote</title>
  </head>
  <body>
    <div id="app"></div>

    <!--
      The bridge must be installed before main.js is evaluated, and building it needs a network
      round trip, so main.js is imported dynamically once boot() resolves.
    -->
    <script type="module">
      import { boot, showBootError } from "./boot.js";
      boot()
        .then(() => import("./main.js"))
        .catch(showBootError);
    </script>
    <script src="./math.js"></script>
  </body>
</html>
